appId: in.munderdiffl.app
productName: Munder Difflin
copyright: Copyright © 2026 Chaitanya Giri

# Where electron-updater looks for new versions (latest*.yml + assets on GitHub
# releases). The release workflow still uploads assets itself (--publish never);
# this block only stamps app-update.yml into the packaged app so the updater
# knows which repo to poll.
publish:
  provider: github
  owner: chaitanyagiri
  repo: munder-difflin

# Bake the update toast's "What's new" list straight into latest*.yml.
#
# Without this, electron-updater has nothing to read: parseUpdateInfo yaml-loads
# the channel file, finds releaseNotes null, and falls back to computeReleaseNotes
# over GitHub's releases.atom feed. That feed carries GitHub's RENDERED HTML of
# RELEASE.md, not its markdown, so the digest sees no `##` headings at all and
# scans for bullets instead. The only line in 53KB that looks like a bullet is
# `* { box-sizing: border-box; }` inside RELEASE.md's <style> block, so the
# toast's entire what's-new list was one CSS rule.
#
# A present releaseNotes means the feed is never consulted. That is the whole
# point: the toast is drawn by the ALREADY RUNNING app, so a parser fix reaches
# only people who have already upgraded, while this is a field every existing
# client on every old version already reads.
#
# Keep this file short and free of HTML. It is sized for a 340px toast (5
# bullets, 280 chars total), NOT for the release page, which stays RELEASE.md.
releaseInfo:
  releaseNotesFile: build/release-notes.md

# Notarize + staple after signing, but only when APPLE_* creds are in the env
# (the hook no-ops otherwise, so contributor builds still work). Root-level hook.
afterSign: build/notarize.cjs

# Register the munderdifflin:// URL scheme (shareable-hires deep link) in the
# packaged app: CFBundleURLTypes on macOS, registry entries via NSIS on Windows.
protocols:
  - name: Munder Difflin
    schemes:
      - munderdifflin

# electron-vite emits the app into out/; package exactly that plus what the
# runtime needs. node-pty is native, so keep it out of the asar.
directories:
  output: dist
  buildResources: build

files:
  - out/**
  - package.json
  # v0.3.4: shipped so the voice get_app_info tool can read release notes.
  - CHANGELOG.md
  - "!**/*.{md,map,ts,tsx}"
  - "!**/{.eslintrc,.prettierrc,tsconfig*.json,electron.vite.config.*}"
  # Local transcription (@huggingface/transformers on onnxruntime-node) runs
  # in Node only: its browser builds, the WASM runtime and onnxruntime-web are
  # never loaded, and the worker stubs `sharp` (image code speech never uses),
  # so none of them ship. Per-platform blocks below drop the other platforms'
  # onnxruntime binaries.
  - "!**/node_modules/onnxruntime-web/**"
  - "!**/node_modules/sharp/**"
  - "!**/node_modules/@img/**"
  - "!**/node_modules/@huggingface/transformers/dist/{*.wasm,ort-wasm*,transformers.js,transformers.min.js,transformers.web.js,transformers.web.min.js}"

# Ship the standalone Slack reply helper as a plain file under the app's
# resources dir (process.resourcesPath). It runs under `node`, NOT inside the
# asar, so the office worker can invoke `node <resources>/md-slack-reply.cjs`.
extraResources:
  - from: resources/md-slack-reply.cjs
    to: md-slack-reply.cjs
  # Knowledge Graph agent CLI + its pure-JS core. Agents invoke `node
  # <resources>/kg.cjs` out-of-process; kg-core.cjs ships beside it so the CLI's
  # `require('./kg-core.cjs')` resolves outside the asar.
  - from: resources/kg.cjs
    to: kg.cjs
  - from: src/main/kg-core.cjs
    to: kg-core.cjs
  # Bundled default skills (read-only/no-secret). copyBundledSkills() reads these
  # from skillsResourceDir() = <process.resourcesPath>/skills in the packaged app
  # and refreshes each agent's .claude/skills/ per spawn (dev resolves to
  # repo resources/skills). Directory copy preserves the <id>/SKILL.md tree.
  - from: resources/skills
    to: skills
  # The bundled Whisper model (transcription's default engine). Filled at
  # release time by `npm run fetch:whisper` (tools/fetch-whisper-model.cjs);
  # absent in a plain checkout, in which case the app downloads it on first
  # use. Read from <process.resourcesPath>/models.
  - from: resources/models
    to: models
    filter:
      - "**/*"
      - "!**/*.part"

asarUnpack:
  - "**/node_modules/node-pty/**"
  # better-sqlite3 is native (bindings/prebuild need the .node on the real FS).
  - "**/node_modules/better-sqlite3/**"
  # onnxruntime-node (local transcription) is native too: its .node binding
  # and the libonnxruntime it links must be real files to dlopen.
  - "**/node_modules/onnxruntime-node/**"

# Rebuild native deps (node-pty) for the target during packaging.
npmRebuild: true

# ---- macOS ----
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  # Declare WHY the app touches the user's folders. macOS shows these strings in
  # the privacy prompt and, for a signed app, remembers the grant — so the user
  # is asked ONCE instead of on every agent action.
  extendInfo:
    NSDocumentsFolderUsageDescription: "Munder Difflin runs your Claude Code agents, which read and write files in the project folders you point them at."
    NSDesktopFolderUsageDescription: "Munder Difflin's agents may work on projects located on your Desktop."
    NSDownloadsFolderUsageDescription: "Munder Difflin's agents may work on projects located in your Downloads."
    NSRemovableVolumesUsageDescription: "Munder Difflin's agents may work on projects located on external volumes."
    NSNetworkVolumesUsageDescription: "Munder Difflin's agents may work on projects located on network volumes."
    # The microphone is used only by opt-in voice features: the Stapler's
    # Record message and Record meeting (meetings also record system audio),
    # Dictate into any app, Free Flow dictation and Realtime Michael. Mic
    # access only happens while one of them is recording.
    NSMicrophoneUsageDescription: "Munder Difflin uses your microphone only while you record: a Stapler message or meeting (meetings also record the other side's audio), dictation into any app, Free Flow dictation, or talking to Michael in real time. Recordings are transcribed on this Mac unless you choose Groq (Free Flow uses Groq; Realtime Michael streams to OpenAI)."
    # Dictate into any app (Stapler, opt-in, off by default) pastes the words
    # into the app in front by asking System Events to press Command-V. macOS
    # refuses that Apple Event outright unless this purpose string exists.
    NSAppleEventsUsageDescription: "Munder Difflin types your dictated words into the app in front of you by pressing paste for you. It only does this right after you dictate, and only when dictation is turned on."
  # Hardened runtime + entitlements so the spawned `claude` agents inherit this
  # app's TCC responsibility (one grant covers them all) and node-pty can load.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  # Disable electron-builder's BUILT-IN notarization. It auto-triggers whenever the
  # APPLE_* env vars are present and runs inside signApp — a path our afterSign hook's
  # try/catch can't guard, so a bad-credential failure there hard-fails the whole
  # release (exactly what bit us). Instead, the root-level `afterSign: build/notarize.cjs`
  # hook does notarization best-effort: it tries, and on failure ships the signed (un-
  # notarized) build rather than sinking the cross-platform release. Notarization
  # resumes automatically once the APPLE_* secrets are valid — no further changes.
  notarize: false
  # Signing: TCC binds a remembered grant to a STABLE code signature, so a signed
  # build is asked for folder access ONCE. The "Developer ID Application" cert is
  # auto-discovered from the login keychain (CSC_IDENTITY_AUTO_DISCOVERY). If no
  # cert is found, electron-builder warns and produces an unsigned build, so
  # contributors without an Apple account can still build.
  #   To sign: install your "Developer ID Application" cert into the keychain.
  #   (Override with CSC_LINK=<path-to.p12> + CSC_KEY_PASSWORD for CI.)
  # Notarization happens in the root-level `afterSign` hook (top of this file).
  # dmg is what humans download; zip is what Squirrel.Mac (electron-updater)
  # actually updates from — latest-mac.yml points at it. Both universal.
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: Munder-Difflin-${version}-mac-${arch}.${ext}
  # onnxruntime-node ships prebuilt darwin/x64 AND darwin/arm64 binaries in one
  # package, so both halves of the universal build carry identical copies;
  # @electron/universal refuses identical Mach-O files unless they are listed
  # here (each is already single-arch, nothing to lipo).
  x64ArchFiles: "**/node_modules/onnxruntime-node/bin/napi-v3/darwin/**"
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/{linux,win32}/**"

dmg:
  title: Munder Difflin ${version}

# ---- Windows ----
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  # Only this platform's (x64) onnxruntime binaries (local transcription).
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: Munder-Difflin-${version}-win-x64-setup.exe
  shortcutName: Munder Difflin

portable:
  artifactName: Munder-Difflin-${version}-win-x64-portable.exe

# ---- Linux ----
linux:
  category: Development
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Munder-Difflin-${version}-linux-x86_64.AppImage
  # Only this platform's (x64) onnxruntime binaries (local transcription).
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/{darwin,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/**"
    # Backstop for an install that ran without the .npmrc / CI skip: the CUDA
    # and TensorRT providers are hundreds of MB and never loaded (CPU only).
    - "!**/node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_{cuda,tensorrt}.so"
